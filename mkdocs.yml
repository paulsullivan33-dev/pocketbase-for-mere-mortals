site_name: PocketBase for Mere Mortals
site_description: A whole backend in a single file you download and run. PocketBase gives a small project its database, its user logins, its file storage and a live API, and this guide builds a working reading list backend with it, checks every claim against the real program as it goes, and states the limits plainly.
site_url: https://paulsullivan33-dev.github.io/pocketbase-for-mere-mortals/
